# Every GIS call this product makes is one of these named, parameter-constrained
# operations. There is deliberately no generic proxy and no dynamic query
# construction: with an entity-wide token, GIS permissions provide no isolation,
# so the set of possible queries has to be closed at build time.
# See Architecture.md section 4.4.

query CurrentPerson {
  currentPerson {
    id
    full_name
    profile_photo
    current_office {
      id
      name
    }
    current_positions {
      id
      title
      status
      start_date
      end_date
      office {
        id
        name
        tag
      }
      role {
        id
        name
      }
    }
  }
}

# The office tree is derived by recursing this, never hardcoded (D-39).
# There is no root `office` field on this schema.
query OfficeChildren($parentIds: [Int]) {
  committees(filters: { parent: $parentIds }, per_page: 100) {
    data {
      id
      name
      tag
      parent {
        id
      }
    }
    paging {
      total_items
      total_pages
    }
  }
}

# status must be ["active"]; "current" is accepted and silently matches nothing.
# personIds narrows to one member, which is how an admin action re-verifies a
# position against live GIS rather than against the last sync (Architecture.md 11).
query MemberPositions(
  $officeId: Int
  $personIds: [ID!]
  $status: [String]
  $page: Int!
  $perPage: Int!
) {
  memberPositions(
    filters: { office_id: $officeId, person_ids: $personIds, status: $status }
    page: $page
    per_page: $perPage
  ) {
    data {
      id
      title
      status
      start_date
      end_date
      office {
        id
        name
      }
      role {
        id
        name
      }
      person {
        id
        full_name
        profile_photo
      }
    }
    paging {
      total_items
      total_pages
      current_page
    }
  }
}

# One operation serves every sync pass; the caller varies the filter, which is
# what keeps the query set closed. No EP contact detail is selected (D-40).
query Applications($filters: ApplicationFilter, $page: Int!, $perPage: Int!) {
  allOpportunityApplication(filters: $filters, page: $page, per_page: $perPage) {
    data {
      id
      status
      created_at
      # Ids only, and only what scoring reads. The EP's name is not requested,
      # so sync cannot store one (D-42); nothing descriptive is requested
      # either, because this product does not display EP or opportunity data --
      # EXPA does that (D-44).
      person {
        id
      }
      opportunity {
        id
        programme {
          id
        }
      }
      meta {
        date_approved
        date_approval_broken
        date_realized
        date_realisation_broke
        remote_realized_at
        date_rejected
        date_withdrawn
      }
    }
    paging {
      total_items
      total_pages
      current_page
    }
  }
}



# The manager EXPA itself records on an application. Shown next to the imported
# assignment so an admin can see where the two disagree; it is read at display
# time and never stored (D-42). EXPA populates it only after approval, so it is
# frequently absent.
query ApplicationManagers($filters: ApplicationFilter, $page: Int!, $perPage: Int!) {
  allOpportunityApplication(filters: $filters, page: $page, per_page: $perPage) {
    data {
      id
      person {
        id
      }
      managers {
        id
        full_name
      }
    }
    paging {
      total_pages
    }
  }
}
