# Every GIS call this product makes is one of these named, parameter-constrained
# operations. There is deliberately no generic proxy and no dynamic query
# construction: with an entity-wide token, GIS permissions provide no isolation,
# so the set of possible queries has to be closed at build time.
# See Architecture.md section 4.4.

query CurrentPerson {
  currentPerson {
    id
    full_name
    profile_photo
    current_office {
      id
      name
    }
    current_positions {
      id
      title
      status
      start_date
      end_date
      office {
        id
        name
        tag
      }
      role {
        id
        name
      }
    }
  }
}

# The office tree is derived by recursing this, never hardcoded (D-39).
# There is no root `office` field on this schema.
query OfficeChildren($parentIds: [Int]) {
  committees(filters: { parent: $parentIds }, per_page: 100) {
    data {
      id
      name
      tag
      parent {
        id
      }
    }
    paging {
      total_items
      total_pages
    }
  }
}

# status must be ["active"]; "current" is accepted and silently matches nothing.
# person_ids narrows to one member, which is how an admin action re-verifies a
# position against live GIS rather than against the last sync (Architecture.md 11).
# end_date.from is the term floor the roster and the member count both need
# (D-60): EXPA leaves a position at status "active" after its term has ended
# often enough that status alone counts people who left.
#
# The whole filter arrives as one input rather than a variable per field,
# because `page`/`per_page`/`q`/`sort` are deprecated on this field in favour
# of the `filters` and `pagination` inputs.
query MemberPositions($filters: MemberPositionFilter, $pagination: Pagination) {
  memberPositions(filters: $filters, pagination: $pagination) {
    data {
      id
      title
      status
      start_date
      end_date
      office {
        id
        name
      }
      role {
        id
        name
        is_active
      }
      person {
        id
        full_name
        profile_photo
      }
    }
    paging {
      total_items
      total_pages
      current_page
    }
  }
}

# One operation serves every sync pass; the caller varies the filter, which is
# what keeps the query set closed. No EP contact detail is selected (D-40).
query Applications($filters: ApplicationFilter, $page: Int!, $perPage: Int!) {
  allOpportunityApplication(filters: $filters, page: $page, per_page: $perPage) {
    data {
      id
      status
      created_at
      # Ids only, and only what scoring reads. The EP's name is not requested,
      # so sync cannot store one (D-42); nothing descriptive is requested
      # either, because this product does not display EP or opportunity data --
      # EXPA does that (D-44).
      person {
        id
      }
      opportunity {
        id
        programme {
          id
        }
      }
      meta {
        date_approved
        date_approval_broken
        date_realized
        date_realisation_broke
        remote_realized_at
        date_rejected
        date_withdrawn
      }
    }
    paging {
      total_items
      total_pages
      current_page
    }
  }
}



# What the assignment console needs to name a row: the EP behind an id, and the
# manager EXPA itself records on the application. Both are read at display time
# and never stored (D-42) -- this is the "read from GIS per view and discarded"
# path that decision carves out, not a relaxation of it. EXPA populates the
# manager only after approval, so it is frequently absent.
query ApplicationContext($filters: ApplicationFilter, $page: Int!, $perPage: Int!) {
  allOpportunityApplication(filters: $filters, page: $page, per_page: $perPage) {
    data {
      id
      person {
        id
        full_name
      }
      managers {
        id
        full_name
      }
    }
    paging {
      total_pages
    }
  }
}
