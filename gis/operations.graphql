# The token is entity-wide, so GIS gives no isolation: every query must be one of these.

query CurrentPerson {
  currentPerson {
    id
    full_name
    profile_photo
    current_office {
      id
      name
    }
    current_positions {
      id
      title
      status
      start_date
      end_date
      office {
        id
        name
        tag
      }
      role {
        id
        name
      }
    }
  }
}

# There is no root `office` field; the tree is built by recursing this.
query OfficeChildren($parentIds: [Int]) {
  committees(filters: { parent: $parentIds }, per_page: 100) {
    data {
      id
      name
      tag
      parent {
        id
      }
    }
    paging {
      total_items
      total_pages
    }
  }
}

# status must be ["active"]; "current" is accepted and silently matches nothing.
# end_date.from is needed too: EXPA often leaves ended positions "active".
# `page`/`per_page`/`q`/`sort` are deprecated here in favour of `filters`/`pagination`.
query MemberPositions($filters: MemberPositionFilter, $pagination: Pagination) {
  memberPositions(filters: $filters, pagination: $pagination) {
    data {
      id
      title
      status
      start_date
      end_date
      office {
        id
        name
      }
      role {
        id
        name
        is_active
      }
      person {
        id
        full_name
        profile_photo
      }
    }
    paging {
      total_items
      total_pages
      current_page
    }
  }
}

# One row carries every stage date, so a single pass covers all stages.
query Applications($filters: ApplicationFilter, $pagination: Pagination) {
  allOpportunityApplication(filters: $filters, pagination: $pagination) {
    data {
      id
      status
      created_at
      updated_at
      # The EP's name is not requested so sync cannot store it.
      # `OpportunityApplication.managers` is a different field and comes back empty.
      person {
        id
        managers {
          id
        }
      }
      opportunity {
        id
        programme {
          id
        }
      }
      meta {
        date_approved
        date_approval_broken
        date_realized
        date_realisation_broke
        remote_realized_at
        date_remote_realization_broken_at
      }
    }
    paging {
      total_items
      total_pages
      current_page
    }
  }
}


query EpManagers($filters: PeopleFilter, $pagination: Pagination) {
  people(filters: $filters, pagination: $pagination) {
    data {
      id
      updated_at
      managers {
        id
      }
    }
    paging {
      total_pages
    }
  }
}

# Read at display time, never stored. Names are resolved by id through `People`.
query ApplicationContext($filters: ApplicationFilter, $pagination: Pagination) {
  allOpportunityApplication(filters: $filters, pagination: $pagination) {
    data {
      id
      status
      updated_at
      person {
        id
      }
      opportunity {
        programme {
          id
        }
      }
    }
    paging {
      total_pages
    }
  }
}

# Managers are named here because non-members have no Member row to name them from.
# `current_positions` is read only to tell a member from an EP.
query People($filters: PeopleFilter, $pagination: Pagination) {
  people(filters: $filters, pagination: $pagination) {
    data {
      id
      full_name
      status
      created_at
      updated_at
      has_opportunity_applications
      managers {
        id
        full_name
      }
      current_positions {
        status
        end_date
        office {
          id
        }
      }
    }
    paging {
      total_pages
    }
  }
}
