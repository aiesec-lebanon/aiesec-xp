name: CI

# Vercel's build runs no tests, lint or secret scan, so a green deploy says
# nothing about whether the code is correct. This does. GitHub Actions is free
# for public repositories.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Placeholders so module-level env checks can run. Nothing here is a secret.
  DATABASE_URL: postgresql://xp:xp@localhost:5432/xp_test
  DIRECT_URL: postgresql://xp:xp@localhost:5432/xp_test
  SESSION_SECRET: ci-session-secret-that-is-at-least-32-chars
  CRON_SECRET: ci-cron-secret-that-is-at-least-32-chars

jobs:
  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        # The gitleaks Action needs a paid licence for organisation repos; the
        # MIT-licensed scanner image does not. Pinned by digest.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect \
            --source /repo --no-git --redact -v
