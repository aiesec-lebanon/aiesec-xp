# Triggers the EP data sync on Vercel (Hobby crons run only daily). The app decides
# whether the five-minute tick has work, so switching modes never edits this file.
# Needs secret CRON_SECRET (same as Vercel) and variable APP_URL (production domain).
name: Sync EP data

on:
  schedule:
    # Offset from the top of the hour, when GitHub delays scheduled runs most.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    # Daily at 00:45 UTC: 03:45 in Beirut in summer, 02:45 in winter.
    - cron: "45 0 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sync-ep-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Call /api/cron/events
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          : "${APP_URL:?Set the APP_URL repository variable}"
          : "${CRON_SECRET:?Set the CRON_SECRET repository secret}"

          # A manual run counts as the daily run.
          cadence=hackathon
          if [ -z "$SCHEDULE" ] || [ "$SCHEDULE" = "45 0 * * *" ]; then cadence=daily; fi

          # The body is statuses and counts only: these logs are public.
          status=$(curl --silent --show-error --max-time 330 \
            --output response.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/events?cadence=$cadence")
          cat response.json; echo
          test "$status" = 200
